<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="dcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041810"/>
      <stop offset="50%" stop-color="#09281C"/>
      <stop offset="100%" stop-color="#020E09"/>
    </linearGradient>
    <filter id="dcBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>
  
  <rect width="1200" height="800" fill="url(#dcBg)"/>
  <circle cx="600" cy="400" r="280" fill="#10B981" opacity="0.14" filter="url(#dcBlur)"/>

  <!-- Network Board Window -->
  <rect x="220" y="140" width="760" height="520" rx="16" fill="#071D15" stroke="#133E2E" stroke-width="1.5"/>
  <rect x="220" y="140" width="760" height="56" rx="16" fill="#0C2B1F"/>
  <rect x="220" y="180" width="760" height="16" fill="#0C2B1F"/>
  <circle cx="256" cy="168" r="6" fill="#FF5F56"/>
  <circle cx="276" cy="168" r="6" fill="#FFBD2E"/>
  <circle cx="296" cy="168" r="6" fill="#27C93F"/>
  <text x="600" y="173" font-family="'Neue Montreal', sans-serif" font-size="14" fill="#6EE7B7" text-anchor="middle" letter-spacing="1">DEVCONNECT // DEVELOPER SOCIAL ECOSYSTEM</text>

  <!-- Network Graph Diagram -->
  <g transform="translate(600, 360)">
    <!-- Connected Lines -->
    <line x1="-160" y1="-80" x2="0" y2="0" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
    <line x1="160" y1="-70" x2="0" y2="0" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
    <line x1="-140" y1="80" x2="0" y2="0" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
    <line x1="150" y1="70" x2="0" y2="0" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>

    <!-- Central Node -->
    <circle cx="0" cy="0" r="45" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="2"/>
    <text x="0" y="6" font-family="'Neue Montreal', sans-serif" font-size="14" font-weight="700" fill="#ECFDF5" text-anchor="middle">CORE</text>

    <!-- Surrounding Nodes -->
    <circle cx="-160" cy="-80" r="32" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
    <text x="-160" y="-76" font-family="'Neue Montreal', sans-serif" font-size="11" fill="#A7F3D0" text-anchor="middle">AUTH / JWT</text>

    <circle cx="160" cy="-70" r="32" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
    <text x="160" y="-66" font-family="'Neue Montreal', sans-serif" font-size="11" fill="#A7F3D0" text-anchor="middle">REDUX STATE</text>

    <circle cx="-140" cy="80" r="32" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
    <text x="-140" y="84" font-family="'Neue Montreal', sans-serif" font-size="11" fill="#A7F3D0" text-anchor="middle">MONGO DB</text>

    <circle cx="150" cy="70" r="32" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
    <text x="150" y="74" font-family="'Neue Montreal', sans-serif" font-size="11" fill="#A7F3D0" text-anchor="middle">FEED API</text>
  </g>

  <!-- Metric Badges -->
  <rect x="280" y="550" width="640" height="44" rx="8" fill="#0B2E21" stroke="#19543E" stroke-width="1"/>
  <text x="600" y="577" font-family="'Neue Montreal', sans-serif" font-size="13" font-weight="600" fill="#34D399" text-anchor="middle">INTERACTIVE COMMUNITY FEED // DYNAMIC PROFILES // WEBSOCKETS</text>

  <text x="600" y="720" font-family="'Neue Montreal', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">DevConnect</text>
</svg>