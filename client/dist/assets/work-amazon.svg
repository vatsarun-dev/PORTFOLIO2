<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="amBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1108"/>
      <stop offset="50%" stop-color="#281A0B"/>
      <stop offset="100%" stop-color="#100A04"/>
    </linearGradient>
    <filter id="amBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>
  
  <rect width="1200" height="800" fill="url(#amBg)"/>
  <circle cx="600" cy="400" r="280" fill="#F59E0B" opacity="0.14" filter="url(#amBlur)"/>

  <!-- Dashboard Window -->
  <rect x="220" y="140" width="760" height="520" rx="16" fill="#1C140B" stroke="#3D2914" stroke-width="1.5"/>
  <rect x="220" y="140" width="760" height="56" rx="16" fill="#291D10"/>
  <rect x="220" y="180" width="760" height="16" fill="#291D10"/>
  <circle cx="256" cy="168" r="6" fill="#FF5F56"/>
  <circle cx="276" cy="168" r="6" fill="#FFBD2E"/>
  <circle cx="296" cy="168" r="6" fill="#27C93F"/>
  <text x="600" y="173" font-family="'Neue Montreal', sans-serif" font-size="14" fill="#FCD34D" text-anchor="middle" letter-spacing="1">AMAZON INVENTORY // STOCK &amp; LOGISTICS ENGINE</text>

  <!-- Metric Panels -->
  <rect x="260" y="230" width="200" height="120" rx="10" fill="#271B0E" stroke="#483218" stroke-width="1"/>
  <text x="280" y="265" font-family="'Neue Montreal', sans-serif" font-size="12" fill="#D97706">ACTIVE SKUs</text>
  <text x="280" y="310" font-family="'Neue Montreal', sans-serif" font-size="32" font-weight="700" fill="#FDE68A">14,820</text>

  <rect x="500" y="230" width="200" height="120" rx="10" fill="#271B0E" stroke="#483218" stroke-width="1"/>
  <text x="520" y="265" font-family="'Neue Montreal', sans-serif" font-size="12" fill="#10B981">FULFILLMENT RATE</text>
  <text x="520" y="310" font-family="'Neue Montreal', sans-serif" font-size="32" font-weight="700" fill="#A7F3D0">99.8%</text>

  <rect x="740" y="230" width="200" height="120" rx="10" fill="#271B0E" stroke="#483218" stroke-width="1"/>
  <text x="760" y="265" font-family="'Neue Montreal', sans-serif" font-size="12" fill="#60A5FA">STOCK TURN</text>
  <text x="760" y="310" font-family="'Neue Montreal', sans-serif" font-size="32" font-weight="700" fill="#BFDBFE">4.2x</text>

  <!-- Bar Graph Visualization -->
  <g transform="translate(260, 390)">
    <rect x="0" y="0" width="680" height="140" rx="10" fill="#21170C" stroke="#3D2914" stroke-width="1"/>
    
    <!-- Bars -->
    <rect x="60" y="70" width="35" height="50" rx="4" fill="#F59E0B" opacity="0.8"/>
    <rect x="130" y="45" width="35" height="75" rx="4" fill="#F59E0B" opacity="0.8"/>
    <rect x="200" y="30" width="35" height="90" rx="4" fill="#F59E0B" opacity="0.8"/>
    <rect x="270" y="60" width="35" height="60" rx="4" fill="#F59E0B" opacity="0.8"/>
    <rect x="340" y="20" width="35" height="100" rx="4" fill="#F59E0B" opacity="0.9"/>
    <rect x="410" y="40" width="35" height="80" rx="4" fill="#F59E0B" opacity="0.8"/>
    <rect x="480" y="25" width="35" height="95" rx="4" fill="#F59E0B" opacity="0.8"/>
    <rect x="550" y="10" width="35" height="110" rx="4" fill="#F59E0B"/>
  </g>

  <rect x="260" y="560" width="680" height="44" rx="8" fill="#261A0C" stroke="#4A3317" stroke-width="1"/>
  <text x="600" y="587" font-family="'Neue Montreal', sans-serif" font-size="13" font-weight="600" fill="#FCD34D" text-anchor="middle">REAL-TIME INVENTORY TRACKING // AUTOMATED REORDER TRIGGERS</text>

  <text x="600" y="720" font-family="'Neue Montreal', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">Amazon Inventory</text>
</svg>