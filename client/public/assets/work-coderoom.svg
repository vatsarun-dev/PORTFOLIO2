<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="crBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120A24"/>
      <stop offset="50%" stop-color="#1E1238"/>
      <stop offset="100%" stop-color="#0A0515"/>
    </linearGradient>
    <filter id="crBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>
  
  <rect width="1200" height="800" fill="url(#crBg)"/>
  <circle cx="600" cy="400" r="280" fill="#9D4EDD" opacity="0.15" filter="url(#crBlur)"/>
  <circle cx="780" cy="320" r="200" fill="#455CE9" opacity="0.15" filter="url(#crBlur)"/>

  <!-- Code Editor Window -->
  <rect x="220" y="140" width="760" height="520" rx="16" fill="#130C26" stroke="#2C1B4D" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="220" y="140" width="760" height="56" rx="16" fill="#1A1133"/>
  <rect x="220" y="180" width="760" height="16" fill="#1A1133"/>
  <circle cx="256" cy="168" r="6" fill="#FF5F56"/>
  <circle cx="276" cy="168" r="6" fill="#FFBD2E"/>
  <circle cx="296" cy="168" r="6" fill="#27C93F"/>
  <text x="600" y="173" font-family="'Neue Montreal', sans-serif" font-size="14" fill="#B794F4" text-anchor="middle" letter-spacing="1">CODEROOM // LIVE COLLABORATIVE MERN EDITOR</text>
  
  <!-- Code Lines -->
  <g font-family="'Courier New', monospace" font-size="16" fill="#A78BFA" transform="translate(260, 230)">
    <text x="0" y="24" fill="#F472B6">import</text>
    <text x="70" y="24" fill="#E2E8F0">{ io } from 'socket.io-client';</text>
    
    <text x="0" y="60" fill="#F472B6">const</text>
    <text x="55" y="60" fill="#38BDF8">socket</text>
    <text x="120" y="60" fill="#E2E8F0">= io('wss://coderoom.mesh/sync');</text>

    <text x="0" y="100" fill="#818CF8">socket.on('editor:sync', ({ buffer, peers }) =&gt; {</text>
    <text x="24" y="136" fill="#34D399">  applyOperationalTransform(buffer);</text>
    <text x="24" y="172" fill="#E2E8F0">  renderLiveCursors(peers);</text>
    <text x="0" y="208" fill="#818CF8">});</text>
  </g>

  <!-- Multi-user Cursors -->
  <g transform="translate(680, 350)">
    <polygon points="0,0 0,22 6,17 14,24 18,20 11,14 19,13" fill="#38BDF8"/>
    <rect x="18" y="20" width="90" height="24" rx="4" fill="#38BDF8"/>
    <text x="63" y="36" font-family="'Neue Montreal', sans-serif" font-size="11" font-weight="600" fill="#0B132B" text-anchor="middle">Arun Vats</text>
  </g>

  <g transform="translate(480, 410)">
    <polygon points="0,0 0,22 6,17 14,24 18,20 11,14 19,13" fill="#34D399"/>
    <rect x="18" y="20" width="70" height="24" rx="4" fill="#34D399"/>
    <text x="53" y="36" font-family="'Neue Montreal', sans-serif" font-size="11" font-weight="600" fill="#0B132B" text-anchor="middle">Peer #2</text>
  </g>

  <!-- Active Rooms Indicator -->
  <rect x="260" y="550" width="680" height="44" rx="8" fill="#1C1236" stroke="#331E5E" stroke-width="1"/>
  <circle cx="285" cy="572" r="5" fill="#34D399"/>
  <text x="300" y="577" font-family="'Neue Montreal', sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">ROOM #8092 ACTIVE // SOCKET.IO BROADCASTING AT 12ms LATENCY</text>

  <text x="600" y="720" font-family="'Neue Montreal', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">CodeRoom</text>
</svg>