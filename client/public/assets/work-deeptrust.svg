<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="dtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1E"/>
      <stop offset="50%" stop-color="#0F1B35"/>
      <stop offset="100%" stop-color="#060B15"/>
    </linearGradient>
    <linearGradient id="dtGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#455CE9"/>
      <stop offset="50%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#455CE9"/>
    </linearGradient>
    <filter id="dtBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>
  
  <rect width="1200" height="800" fill="url(#dtBg)"/>
  
  <!-- Ambient background glow -->
  <circle cx="600" cy="400" r="300" fill="#455CE9" opacity="0.18" filter="url(#dtBlur)"/>
  <circle cx="750" cy="300" r="220" fill="#00D2FF" opacity="0.12" filter="url(#dtBlur)"/>
  
  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="1000" y1="0" x2="1000" y2="800"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Central Card / Terminal Display -->
  <rect x="220" y="140" width="760" height="520" rx="16" fill="#0C1527" stroke="#253556" stroke-width="1.5" opacity="0.95"/>
  
  <!-- Window Header -->
  <rect x="220" y="140" width="760" height="56" rx="16" fill="#13203A"/>
  <rect x="220" y="180" width="760" height="16" fill="#13203A"/>
  <circle cx="256" cy="168" r="6" fill="#FF5F56"/>
  <circle cx="276" cy="168" r="6" fill="#FFBD2E"/>
  <circle cx="296" cy="168" r="6" fill="#27C93F"/>
  <text x="600" y="173" font-family="'Neue Montreal', sans-serif" font-size="14" fill="#8E9EB5" text-anchor="middle" letter-spacing="1">DEEPTRUST // MULTIMODAL MISINFORMATION DETECTOR</text>
  
  <!-- Verification Shield Icon -->
  <g transform="translate(600, 310)">
    <path d="M0 -60 L50 -35 L50 25 C50 60 0 85 0 85 C0 85 -50 60 -50 25 L-50 -35 Z" fill="none" stroke="url(#dtGlow)" stroke-width="3"/>
    <path d="M-20 8 L-5 24 L24 -12" fill="none" stroke="#00D2FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="12" r="75" fill="none" stroke="#455CE9" stroke-width="1" stroke-dasharray="6 6" opacity="0.6"/>
  </g>
  
  <!-- Metrics & Analysis Wave -->
  <g transform="translate(300, 440)">
    <!-- Spectrogram line -->
    <path d="M0 60 Q 50 10, 100 50 T 200 30 T 300 70 T 400 20 T 500 50 T 600 40" fill="none" stroke="#00D2FF" stroke-width="2.5" opacity="0.85"/>
    <path d="M0 60 Q 50 30, 100 65 T 200 50 T 300 80 T 400 35 T 500 60 T 600 55" fill="none" stroke="#455CE9" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Status Badges -->
  <rect x="290" y="550" width="180" height="44" rx="8" fill="#13233F" stroke="#253E6B" stroke-width="1"/>
  <text x="380" y="577" font-family="'Neue Montreal', sans-serif" font-size="13" font-weight="600" fill="#00D2FF" text-anchor="middle">AUTHENTICITY: 99.4%</text>

  <rect x="490" y="550" width="200" height="44" rx="8" fill="#13233F" stroke="#253E6B" stroke-width="1"/>
  <text x="590" y="577" font-family="'Neue Montreal', sans-serif" font-size="13" font-weight="600" fill="#8E9EB5" text-anchor="middle">RAG EXPLAINABLE EVIDENCE</text>

  <rect x="710" y="550" width="190" height="44" rx="8" fill="#13233F" stroke="#253E6B" stroke-width="1"/>
  <text x="805" y="577" font-family="'Neue Montreal', sans-serif" font-size="13" font-weight="600" fill="#8E9EB5" text-anchor="middle">REAL-TIME MEDIA AUDIT</text>
  
  <text x="600" y="720" font-family="'Neue Montreal', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">DeepTrust</text>
</svg>